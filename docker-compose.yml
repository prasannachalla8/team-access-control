version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tacapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: team_access_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cpr@2528
    ports:
      - "5432:5432"
    volumes:
      - tacapi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_access_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tacapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./team-access-control
    container_name: tacapi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/team_access_db
      DB_USER: postgres
      DB_PASSWORD: cpr@2528
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./client
    container_name: tacapi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  tacapi_postgres_data: